#############
### INPUT ###
#############

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,th
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
    name = compx-garuda-pro-wireless
    sensitivity = -0.5
}

device {
    name = gtech-atk68 
    repeat_rate=50
    repeat_delay=500
    middle_button_emulation=0
}

cursor {
    # See https://wiki.hyprland.org/Configuring/Variables/#cursor for more

    sync_gsettings_theme = true
    no_hardware_cursors = true
    no_break_fs_vrr = true
    enable_hyprcursor = true  
    #allow_dumb_copy = true
    use_cpu_buffer = true
    default_monitor = DP-2
    #inactive_timeout = 5
    #no_warps = 1
}

#Could help when scaling and not pixelating
xwayland {
    enabled = true
    force_zero_scaling = true
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    #pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}


master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
    new_status = master
}


gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    #workspace_swipe = off
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/#misc for more
    
    #force_default_wallpaper = -1 # Set to 0 to disable the anime mascot wallpapers
    disable_hyprland_logo = yes
    initial_workspace_tracking = false
    #new_window_takes_over_fullscreen = 1
    vrr = 0 # controls the VRR (Adaptive Sync) of your monitors. 0 - off, 1 - on, 2 - fullscreen only
    swallow_regex = ^(kitty)$
}

opengl {
    nvidia_anti_flicker = true
    #force_introspection = 1
}

render {
    direct_scanout = true #for fullscreen games
    #explicit_sync = true
    #explicit_sync_kms = true
}
